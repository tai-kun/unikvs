name: CI

on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  test:
    env:
      _RUSTFS_VERSION: "1.0.0-alpha.98"
    strategy:
      fail-fast: false
      matrix:
        package-directory:
          - unikvs
          - packages/checksum
          - packages/compression
          - packages/core
          - packages/fs.node
          - packages/indexeddb
          - packages/memory
          - packages/opfs
          - packages/s3.node
          - packages/utils
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: "チェックアウト"
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: "mise をセットアップ"
        uses: jdx/mise-action@146a28175021df8ca24f8ee1828cc2a60f980bd5 # v3.5.1

      - name: "依存関係をインストール（ルート）"
        run: npm ci

      - name: "内部依存パッケージのビルド"
        run: |
          root_directory=$(pwd)
          root_package_json="${root_directory}/package.json"

          cd ${{ matrix.package-directory }}

          # 1. 現在のパッケージの依存関係を抽出
          dependencies=$(jq -r '.dependencies // {} | keys[] | select(startswith("@unikvs/")) | split("/")[1]' package.json)
          dev_dependencies=$(jq -r '.devDependencies // {} | keys[] | select(startswith("@unikvs/")) | split("/")[1]' package.json)

          # 重複を排除した依存パッケージリスト
          raw_deps=$(echo "$dependencies $dev_dependencies" | tr ' ' '\n' | sort -u)

          # 2. ルートの workspaces の順番に従ってソート
          # - root の workspaces から "packages/name" の "name" 部分だけを取り出して順番を保持
          # - raw_deps に含まれるものだけを、その順番でフィルタリング
          all_dependencies=$(jq -r --argjson deps "$(echo "$raw_deps" | jq -R . | jq -s .)" \
            '.workspaces[] | sub("packages/"; "") | select(. as $pkg | $deps | index($pkg))' \
            "$root_package_json")

          # 3. ビルド実行
          for package_name in $all_dependencies; do
            target_directory="${root_directory}/packages/${package_name}"
            if [ -d "${target_directory}" ]; then
              echo "Building internal dependency: ${package_name} in ${target_directory}"
              (cd "${target_directory}" && npm run build)
            else
              # unikvs など packages/ 外にあるディレクトリの場合のフォールバック
              if [ -d "${root_directory}/${package_name}" ]; then
                target_directory="${root_directory}/${package_name}"
                echo "Building internal dependency: ${package_name} in ${target_directory}"
                (cd "${target_directory}" && npm run build)
              else
                echo "Error: Directory ${target_directory} not found, skipping."
                exit 1
              fi
            fi
          done

      - name: "依存関係をインストール（パッケージ）"
        run: |
          if grep -q "playwright" package.json; then
            npx playwright install --with-deps
          fi
        working-directory: ${{ matrix.package-directory }}

      - name: "テスト準備"
        run: |
          if [ -f ./scripts/pretest.sh ]; then
            bash -euo pipefail ./scripts/pretest.sh
          fi
        working-directory: ${{ matrix.package-directory }}

      - name: "テスト"
        run: mise run test
        working-directory: ${{ matrix.package-directory }}

      - name: "ビルド"
        run: npm run build
        working-directory: ${{ matrix.package-directory }}
