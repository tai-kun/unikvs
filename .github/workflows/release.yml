name: "リリース"
run-name: "リリース"

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  release:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: "チェックアウト"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: "mise をセットアップ"
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3

      - name: "Node.js をセットアップ"
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          cache: pnpm
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: "依存関係をインストール"
        run: pnpm i

      - name: "ビルド"
        run: npm run build --workspaces

      - name: "パッケージ検証"
        run: |
          for pkg in $(jq -r '.workspaces[]' package.json); do
            if [ ! -f "$pkg/package.json" ]; then
              continue
            fi

            if [ "$(jq -r .private "$pkg/package.json")" = "true" ]; then
              continue
            fi

            file=$(npm pack "./$pkg" --pack-destination "$RUNNER_TEMP" 2>/dev/null | tail -n 1)
            npx publint "$RUNNER_TEMP/$file"
            npx attw --profile esm-only "$RUNNER_TEMP/$file"
          done

      - name: "ブラウザーをインストール"
        run: (cd packages/core && npx playwright install --with-deps)

      - name: "テスト"
        run: |
          for pkg in $(jq -r '.workspaces[]' package.json); do
            if [ ! -f "$pkg/package.json" ]; then
              continue
            fi

            echo "===== $pkg"
            (cd "$pkg" && mise run test)
          done

      - name: "バージョンを更新"
        run: |
          set +e
          output=$(pnpm exec changeset version 2>&1)
          status=$?
          set -e

          echo "$output"

          if [ "$status" -ne 0 ] && ! echo "$output" | grep -q "No unreleased changesets found"; then
            exit "$status"
          fi

      - name: "バージョン変更をコミット"
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ -z "$(git status --porcelain)" ]; then
            echo "コミットする変更はありません"
            exit 0
          fi

          git add -A
          git commit -m "chore: バージョンを更新"
          git push

      - name: "公開"
        run: |
          before_tags=$(mktemp)
          after_tags=$(mktemp)

          git tag | sort > "$before_tags"
          pnpm exec changeset publish
          git tag | sort > "$after_tags"

          comm -13 "$before_tags" "$after_tags" > "$RUNNER_TEMP/new-tags.txt"
          echo "作成されたタグ:"
          cat "$RUNNER_TEMP/new-tags.txt"

      - name: "タグをプッシュ"
        run: git push origin --tags

      - name: "Release の作成"
        run: |
          while read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi

            gh release create "$tag" --generate-notes
          done < "$RUNNER_TEMP/new-tags.txt"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "pnpm ログをアップロード"
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pnpm-logs-publish
          path: /home/runner/.pnpm-debug.log
          if-no-files-found: ignore
          retention-days: 3
