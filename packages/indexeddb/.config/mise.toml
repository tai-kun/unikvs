[tasks.test]
run = [{ task = "test:client" }, { task = "test:check" }]
env = { CI = 1 }

[tasks."test:client"]
run = "npx vp test --config ./.config/vite.config.ts"

[tasks."test:coverage"]
run = "npx vp test run --coverage --config ./.config/vite.config.ts"
env = { CI = 1 }

[tasks."test:check"]
run = "npx vp check"

[tasks.check]
run = "npx vp check --fix"

[tasks.update]
run = ["npx playwright install --with-deps"]
