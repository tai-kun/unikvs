[tasks.test]
run = [{ task = "test:bun" }, { task = "test:check" }]
env = { CI = 1 }

[tasks."test:bun"]
run = "bun x --bun npx vp test --config ./.config/vite.bun.config.ts"

[tasks."test:coverage"]
run = "bun x --bun npx vp test run --coverage --config ./.config/vite.bun.config.ts"
env = { CI = 1 }

[tasks."test:check"]
run = "npx vp check"

[tasks.check]
run = "npx vp check --fix"

[tasks.update]
run = []
