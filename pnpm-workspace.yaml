packages:
  [
    "packages/brotli.bun",
    "packages/core",
    "packages/cache-storage",
    "packages/cloudflare-cache",
    "packages/cloudflare-kv",
    "packages/cloudflare-r2",
    "packages/cookies",
    "packages/debug",
    "packages/etcd",
    "packages/expiry",
    "packages/http",
    "packages/indexeddb",
    "packages/json",
    "packages/localstorage",
    "packages/lru-cache",
    "packages/memcached",
    "packages/memory",
    "packages/metrics",
    "packages/null",
    "packages/passthrough",
    "packages/allow-repair",
    "packages/key-prefix",
    "packages/rate-limit",
    "packages/readonly",
    "packages/redis.bun",
    "packages/redis.node",
    "packages/retry",
    "packages/s3.bun",
    "packages/s3.node",
    "packages/session-storage",
    "packages/soft-delete",
    "packages/superjson",
    "packages/testing",
    "packages/tracing",
    "packages/ttl",
    "packages/utils",
    "packages/base64",
    "packages/base64url",
    "packages/brotli.node",
    "packages/brotli.wasm",
    "packages/cbor",
    "packages/checksum",
    "packages/compression",
    "packages/fs.bun",
    "packages/fs.node",
    "packages/hex",
    "packages/opfs",
    "packages/v8-serde",
    "packages/valkey",
    "packages/vercel-blob",
    "packages/vercel-runtime-cache",
    "packages/writeonly",
    "packages/zstd.bun",
    "packages/zstd.node",
    "packages/zstd.wasm",
    "unikvs",
    "website",
  ]

minimumReleaseAge: 10080 # 7 日
minimumReleaseAgeExclude:
  - "@oxfmt/*"
  - "@oxlint-tsgolint/*"
  - "@oxlint/*"
  - "@tai-kun/blume-integrations"
  - "@tai-kun/vp-lint-plugins"
  - "@vitest/*"
  - "@voidzero-dev/*"
  - call-fn-once
  - oxfmt
  - oxlint
  - oxlint-tsgolint
  - vite-plus
  - vitest

blockExoticSubdeps: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - "@pierre/theme"
  - "@vercel/*"
  - "chokidar"
  - "semver"
  - "undici-types"

strictDepBuilds: true
onlyBuiltDependencies: []
allowBuilds:
  esbuild: true

update:
  ignoreDeps:
    - "*" # パッケージの更新は ncu に任せます。

catalog:
  "@vitest/browser-playwright": 5.0.5
  "@vitest/coverage-istanbul": 5.0.5
  "@vitest/coverage-v8": 5.0.5
  playwright: 1.64.1
  vite-plus: 1.3.0
  vitest-browser-react: 2.3.0
overrides:
  dompurify: 3.4.17
