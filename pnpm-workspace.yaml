minimumReleaseAge: 10080 # 7 日
minimumReleaseAgeExclude:
  - "@scalar/astro@0.4.21"
  - "@scalar/client-side-rendering@0.4.3"
  - "@scalar/helpers@0.13.0"
  - "@scalar/schemas@0.11.0"
  - "@scalar/types@0.21.0"
  - "@scalar/validation@0.6.4"
  - abort-signal-utils
  - blume
  - call-fn-once
  - fast-utf8
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - "@pierre/theme"
  - "@vercel/*"
  - chokidar
  - semver
  - undici-types
strictDepBuilds: true
onlyBuiltDependencies: []
allowBuilds:
  cbor-extract: false # インストールスクリプトは実行せず、プリビルドのネイティブバイナリーのみを使います。
  esbuild: true
update:
  ignoreDeps:
    - "*" # パッケージの更新は ncu に任せます。
packages:
  [
    "packages/core",
    "packages/debug",
    "packages/http",
    "packages/indexeddb",
    "packages/json",
    "packages/localstorage",
    "packages/lru-cache",
    "packages/memory",
    "packages/null",
    "packages/passthrough",
    "packages/allow-repair",
    "packages/key-prefix",
    "packages/redis.bun",
    "packages/redis.node",
    "packages/s3.bun",
    "packages/s3.node",
    "packages/session-storage",
    "packages/superjson",
    "packages/testing",
    "packages/utils",
    "packages/base64",
    "packages/base64url",
    "packages/cbor",
    "packages/checksum",
    "packages/compression",
    "packages/fs.bun",
    "packages/fs.node",
    "packages/hex",
    "packages/opfs",
    "packages/v8-serde",
    "packages/writeonly",
    "packages/zstd.node",
    "packages/zstd.wasm",
    "unikvs",
  ]
