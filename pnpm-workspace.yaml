    "packages/vercel-runtime-cache",
    "packages/writeonly",
    "packages/zstd.bun",
    "packages/zstd.node",
    "packages/zstd.wasm",
    "unikvs",
  ]

minimumReleaseAge: 10080 # 7 日
minimumReleaseAgeExclude:
  - "@scalar/astro@0.4.21"
  - "@scalar/client-side-rendering@0.4.3"
  - "@scalar/helpers@0.13.0"
  - "@scalar/schemas@0.11.0"
  - "@scalar/types@0.21.0"
  - "@scalar/validation@0.6.4"
  - "@tai-kun/blume-integrations"
  - abort-signal-utils
  - blume
  - call-fn-once
  - fast-utf8

blockExoticSubdeps: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - "@pierre/theme"
  - "@vercel/*"
  - "chokidar"
  - "semver"
  - "undici-types"

strictDepBuilds: true
onlyBuiltDependencies: []
allowBuilds:
  cbor-extract: false # インストールスクリプトは実行せず、プリビルドのネイティブバイナリーのみを使います。
  esbuild: true

update:
  ignoreDeps:
    - "*" # パッケージの更新は ncu に任せます。

overrides: {}
